name: Deploy Node.js App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/node-aws-app:latest .
          docker push $ECR_REGISTRY/node-aws-app:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Login to ECR directly
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 510720290862.dkr.ecr.us-east-1.amazonaws.com
            # Stop old container
            docker stop node-app || true
            docker rm node-app || true
            # Run new container
            docker run -d --name node-app -p 3000:3000 510720290862.dkr.ecr.us-east-1.amazonaws.com/node-aws-app:latest
